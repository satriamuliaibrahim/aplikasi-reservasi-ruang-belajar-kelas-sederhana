<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | RuangBelajar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">RB</div>
    <p class="eyebrow">SISTEM INFORMASI KAMPUS</p>
    <h1>Reservasi Ruang Belajar</h1>
    <p class="muted">Masukkan nama, NIM, dan password akun kamu untuk melanjutkan.</p>
    <form id="loginForm">
      <div class="form-field">
        <label for="nama">Nama lengkap</label>
        <input id="nama" name="nama" required placeholder="Masukkan nama lengkap" autocomplete="name">
      </div>
      <div class="form-field">
        <label for="nim">NIM</label>
        <input id="nim" name="nim" required placeholder="Masukkan NIM" autocomplete="username">
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required placeholder="Masukkan password" autocomplete="current-password">
      </div>
      <div class="form-field">
        <label for="role">Masuk sebagai</label>
        <select id="role">
          <option value="mahasiswa">Mahasiswa</option>
          <option value="petugas">Petugas</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button class="btn primary full" type="submit">Masuk ke Dashboard →</button>
    </form>
    <p class="register-prompt">Belum punya akun? <a href="register.html">Daftar sekarang</a></p>
    <p class="small-note">Prototype front-end. Login demo belum terhubung ke server atau database.</p>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
