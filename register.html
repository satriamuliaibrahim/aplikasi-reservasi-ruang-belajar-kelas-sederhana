<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun | RuangBelajar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-card register-card">
    <a class="back-link" href="index.html">← Kembali ke login</a>
    <div class="brand-mark">RB</div>
    <p class="eyebrow">BUAT AKUN BARU</p>
    <h1>Daftar Akun</h1>
    <p class="muted">Isi data di bawah untuk membuat akun mahasiswa.</p>
    <form id="registerForm">
      <div class="form-field">
        <label for="regNama">Nama lengkap</label>
        <input id="regNama" name="nama" required placeholder="Masukkan nama lengkap" autocomplete="name">
      </div>
      <div class="form-field">
        <label for="regNim">NIM</label>
        <input id="regNim" name="nim" required placeholder="Masukkan NIM" autocomplete="off">
      </div>
      <div class="form-field">
        <label for="regEmail">Email</label>
        <input id="regEmail" name="email" type="email" required placeholder="nama@email.com" autocomplete="email">
      </div>
      <div class="form-field">
        <label for="regPassword">Password</label>
        <input id="regPassword" name="password" type="password" required minlength="6" placeholder="Minimal 6 karakter" autocomplete="new-password">
      </div>
      <div class="form-field">
        <label for="regConfirm">Konfirmasi password</label>
        <input id="regConfirm" name="confirmPassword" type="password" required minlength="6" placeholder="Ulangi password" autocomplete="new-password">
      </div>
      <p id="registerMessage" class="register-message" role="status" aria-live="polite"></p>
      <button class="btn primary full" type="submit">Buat Akun →</button>
    </form>
    <p class="register-prompt">Sudah punya akun? <a href="index.html">Masuk di sini</a></p>
    <p class="small-note">Data hanya disimpan di browser untuk keperluan demo, bukan database sungguhan.</p>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
